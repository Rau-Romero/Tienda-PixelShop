<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrador | PixelShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-top">
      <a href="index.html" class="logo">Pixel<span>Shop</span></a>
      <div class="accesos"><a href="index.html">Volver a la tienda</a><button class="btn-sec" id="salir" hidden>Salir</button></div>
    </div>
  </header>

  <section id="login" class="login">
    <form id="form-login" class="caja">
      <h1>Acceso de administrador</h1>
      <label>Usuario<input id="usuario" autocomplete="username" required autofocus></label>
      <label>Contraseña<input type="password" id="clave" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>

  <main id="panel" class="seccion" hidden>
    <p id="aviso" class="aviso" role="status" hidden></p>
    <div class="tabs">
      <button class="tab activa" data-vista="productos">Productos</button>
      <button class="tab" data-vista="consolas">Consolas</button>
    </div>
    <div id="vista-productos">
    <div class="cabecera-admin">
      <h1 class="titulo-cat">Productos</h1>
      <button class="btn-hero" id="nuevo">Nuevo producto</button>
    </div>
    <div class="herramientas">
      <input type="search" id="buscar" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
      <select id="filtro-consola" aria-label="Filtrar por consola"></select>
      <span class="meta" id="total"></span>
    </div>
    <div class="tabla-caja">
      <table>
        <thead><tr><th>Imagen</th><th>Nombre</th><th>Consola</th><th>Tipo</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    </div>
    <div id="vista-consolas" hidden>
      <div class="cabecera-admin">
        <h1 class="titulo-cat">Consolas</h1>
        <button class="btn-hero" id="nueva-consola">Nueva consola</button>
      </div>
      <p class="meta" style="margin:.5rem 0 1.5rem">Cada consola es una categoría del menú de la tienda.</p>
      <div class="tabla-caja">
        <table>
          <thead><tr><th>Orden</th><th>Nombre</th><th>Slug</th><th>Productos</th><th>Acciones</th></tr></thead>
          <tbody id="filas-c"></tbody>
        </table>
      </div>
    </div>
  </main>

  <dialog id="dlg-c">
    <form id="form-c" class="form-prod">
      <h2 id="titulo-c">Nueva consola</h2>
      <input type="hidden" name="cid">
      <label class="ancho">Nombre<input name="nombre" required placeholder="Ej: Nintendo 3DS"></label>
      <label>Slug (opcional)<input name="slug" placeholder="se genera solo"></label>
      <label>Orden en el menú<input name="orden" type="number" min="1" step="1" required></label>
      <div class="ancho botones">
        <button type="button" class="btn-sec oscuro" id="cancelar-c">Cancelar</button>
        <button type="submit" class="btn">Guardar consola</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg">
    <form id="form" class="form-prod">
      <h2 id="titulo-form">Nuevo producto</h2>
      <input type="hidden" name="pid">
      <label class="ancho">Nombre<input name="nombre" required></label>
      <label class="ancho">Descripción<textarea name="descripcion" rows="2"></textarea></label>
      <label>Precio (€)<input name="precio" type="number" step="0.01" min="0" required></label>
      <label>Precio anterior (€)<input name="precioAnterior" type="number" step="0.01" min="0" placeholder="0 si no hay oferta"></label>
      <label>Consola<select name="consolaId" id="f-consola" required></select></label>
      <label>Tipo
        <select name="tipo"><option>videojuego</option><option>consola</option><option>accesorio</option><option>figura</option><option>digital</option></select>
      </label>
      <label>Edición<input name="edicion" value="Estándar" required></label>
      <label>Stock<input name="stock" type="number" min="0" step="1" required></label>
      <label>Estado<select name="estado"><option value="disponible">Disponible</option><option value="reserva">Reserva</option></select></label>
      <label>Fecha de lanzamiento<input name="fechaLanzamiento" type="date" required></label>
      <label class="ancho">URL de la imagen<input name="imagen" type="url" placeholder="https://… (vacío = portada automática)"></label>
      <label class="check"><input name="destacado" type="checkbox"> Producto destacado</label>
      <div class="ancho botones">
        <button type="button" class="btn-sec oscuro" id="cancelar">Cancelar</button>
        <button type="submit" class="btn">Guardar producto</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
