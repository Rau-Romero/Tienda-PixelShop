<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categoría | PixelShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-top">
      <a href="index.html" class="logo">Pixel<span>Shop</span></a>
      <div class="accesos"><a href="admin.html">Administrador</a><a class="carrito" id="carrito" href="carrito.html">Cesta (0)</a></div>
    </div>
    <div class="menu"><nav id="menu-consolas" aria-label="Consolas"></nav></div>
  </header>
  <main class="seccion">
    <h1 id="titulo" class="titulo-cat">Cargando…</h1>
    <p class="meta" id="cuenta"></p>
    <div class="herramientas">
      <input type="search" id="buscar" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
      <select id="estado" aria-label="Estado">
        <option value="">Todos</option><option value="disponible">Disponibles</option><option value="reserva">En reserva</option>
      </select>
      <select id="orden" aria-label="Ordenar">
        <option value="">Orden original</option><option value="menor">Precio: menor a mayor</option><option value="mayor">Precio: mayor a menor</option>
      </select>
    </div>
    <div class="grid" id="lista"></div>
  </main>
  <footer class="pie">© 2026 PixelShop. Todos los derechos reservados.</footer>
  <script src="js/api.js"></script>
  <script src="js/categoria.js"></script>
</body>
</html>
